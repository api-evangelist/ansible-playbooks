specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Ansible Playbooks
providerId: ansible-playbooks
publisherName: Ansible Playbooks
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Ansible
  - Automation
  - Configuration Management
  - DevOps
  - Infrastructure As Code
  - Orchestration
  - Playbooks
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Ansible Playbooks API surface. Provides a FOCUS-aligned
  mapping for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Ansible Playbooks
  ServiceCategory: Developer Tools / API
  ProviderName: Ansible Playbooks
  PublisherName: Ansible Playbooks
  InvoiceIssuerName: Ansible Playbooks
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Ansible Automation Platform API
    baseURL: https://your-aap-instance/api/v2/
    tags:
      - Ansible
      - Automation
      - Enterprise
      - Jobs
      - Orchestration
      - Playbooks
      - Red Hat
    serviceName: Ansible Automation Platform API
    serviceCategory: API
  - name: AWX API
    baseURL: https://your-awx-instance/api/v2/
    tags:
      - Ansible
      - Automation
      - AWX
      - Open Source
      - Playbooks
    serviceName: AWX API
    serviceCategory: API
  - name: Ansible Runner API
    baseURL: https://pypi.org/project/ansible-runner/
    tags:
      - Ansible
      - Automation
      - Library
      - Playbooks
      - Python
    serviceName: Ansible Runner API
    serviceCategory: API
  - name: Ansible Galaxy API
    baseURL: https://galaxy.ansible.com/api/
    tags:
      - Ansible
      - Collections
      - Community
      - Galaxy
      - Roles
    serviceName: Ansible Galaxy API
    serviceCategory: API
  - name: Ansible Automation Hub API
    baseURL: https://console.redhat.com/api/automation-hub/
    tags:
      - Ansible
      - Certified Content
      - Collections
      - Enterprise
      - Red Hat
    serviceName: Ansible Automation Hub API
