  - name: Ansible Semaphore API
    baseURL: https://your-semaphore-instance/api/
    tags:
      - Ansible
      - Open Source
      - Playbooks
      - Semaphore
      - Workflow
    serviceName: Ansible Semaphore API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
    X: apievangelist
    url: https://apievangelist.com
